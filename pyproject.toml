[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-transcription-engine"
version = "0.1.0"
description = "A private video/audio preparation and hosted OpenAI transcription CLI."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=3.24,<4",
    "openpyxl>=3.1,<4",
]

[project.urls]
Repository = "https://github.com/BitMorpher/voice-transcription-engine"

[project.scripts]
voice-transcribe = "voice_transcription_engine.cli:entrypoint"
voice-batch = "voice_transcription_engine.batch.cli:main"

[project.optional-dependencies]
notebook = [
    "pydub>=0.25.1,<0.26",
    "audioop-lts>=0.2.2,<0.3; python_version >= '3.13'",
    "ipykernel>=7.4,<8",
    "jupyterlab>=4.6,<5",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17"]

[tool.setuptools]
packages = ["voice_transcription_engine", "voice_transcription_engine.prompts", "voice_transcription_engine.batch"]
package-dir = {"voice_transcription_engine" = "src"}

[tool.setuptools.package-data]
"voice_transcription_engine.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
required-version = ">=0.12.23"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
